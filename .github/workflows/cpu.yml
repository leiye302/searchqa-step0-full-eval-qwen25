name: Clean-checkout Search-QA step-0 checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    env:
      CUDA_VISIBLE_DEVICES: ''
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      HF_HUB_DISABLE_XET: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python evaluate.py setup
      - run: python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r .deps/searchqa-grpo/configs/requirements-cpu.txt
      - run: python -m pytest -q tests
      - run: python evaluate.py plan > /tmp/searchqa-step0-plan.yaml
      - name: Verify the public 51,713-question test set without model weights
        run: python -c 'import evaluate; evaluate.reference(); evaluate.prepare_test(evaluate.DEFAULT_DATA)'
      - name: Native search and normalized EM with a local HTTP fixture
        run: python .deps/searchqa-grpo/src/env_smoke.py
